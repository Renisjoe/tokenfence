# Netlify publishes this repository as a static site. site/ is the entire
# deliverable — one HTML file, no build step, no dependencies — so there is
# nothing to compile and nothing to install first.
#
# This file exists because of what Netlify does without it: it finds a
# package.json, detects no framework, and falls back to publishing the
# repository root. The landing page would then be served at /site/ rather than
# at the root of the site, which is not where anything points.
#
# Nothing about a domain belongs in this file. Netlify's free hostname is
# <site>.netlify.app, and a custom domain is added under Domain management in
# their UI — see docs/setup-domain-and-email.md, and note that no host can
# register a name for you.

[build]
  publish = "site"
