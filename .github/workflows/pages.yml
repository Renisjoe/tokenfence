name: Deploy site to GitHub Pages

# site/ is a single static file with no build step, so this workflow publishes
# the folder as-is.
#
# One-time setup after the first push:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions
# The custom domain comes from site/CNAME. Add it under
# Settings -> Pages -> Custom domain and point its DNS at GitHub Pages before a
# certificate will be issued — see docs/setup-domain-and-email.md.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
