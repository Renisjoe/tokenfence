name: Deploy site to InfinityFree

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/infinityfree.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinityfree-deploy
  cancel-in-progress: true

jobs:
  deploy:
    # Add the FTP secrets first, then set this repository variable to "true".
    # Until then this job is skipped and cannot fail on missing credentials.
    if: vars.INFINITYFREE_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v6

      - name: Upload the static landing page
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: site/
          server-dir: /htdocs/
